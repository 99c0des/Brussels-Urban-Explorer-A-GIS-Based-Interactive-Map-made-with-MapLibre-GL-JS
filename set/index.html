<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brussels Urban Explorer</title>

    <!-- MapLibre CSS -->
    <link
        href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <!-- Our custom stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar (becomes a slide-over drawer on phones) -->
    <aside id="sidebar">
        <h1>Brussels Urban Explorer</h1>

        <p class="subtitle">
            Explore parks, restaurants and public transport across Brussels.
        </p>

        <hr>

        <h2>Search</h2>

        <!-- Search -->
        <div class="search-box">
            <div class="search-input-row">
                <div class="search-field">
                    <input
                        type="text"
                        id="place-search"
                        placeholder="Search parks, restaurants, pizza..."
                        autocomplete="off"
                        role="combobox"
                        aria-expanded="false"
                        aria-controls="suggestions"
                    >
                    <ul id="suggestions" class="suggest" role="listbox" hidden></ul>
                </div>

                <button
                    id="clear-search"
                    type="button"
                    aria-label="Clear search and results"
                    title="Clear search"
                    data-icon="close"
                >×</button>
            </div>

            <button id="search-button" type="button">Search</button>

            <p id="search-message" aria-live="polite"></p>

            <div class="try-row">
                <span>Try:</span>
                <button type="button" class="chip" data-q="pizza">pizza</button>
                <button type="button" class="chip" data-q="burger">burger</button>
                <button type="button" class="chip" data-q="park">park</button>
            </div>
        </div>

        <!-- Directions + saved shortcuts -->
        <div class="nav-buttons">
           <button type="button" id="nav-directions" class="nav-btn" data-icon="directions">Directions</button>
            <button type="button" id="nav-saved" class="nav-btn" data-icon="star">Saved <span id="saved-badge" class="badge">0</span></button>
                
            </button>
        </div>

        <hr>

        <!-- Explore by Category -->
        <h2>Explore by category</h2>

        <div class="category-buttons">
            <button type="button" class="category-button" data-category="parks" data-icon="park">Explore Parks</button>
            <button type="button" class="category-button" data-category="restaurants" data-icon="restaurant">Explore Restaurants</button>
            <button type="button" class="category-button" data-category="busstops" data-icon="bus">Explore Bus Stops</button>
            <button type="button" class="category-button" data-category="all" data-icon="layers">Explore All Places</button>
        </div>

        <h2>Map layers</h2>

        <div class="layer-control">
            <label>
                <input type="checkbox" id="toggle-parks" checked>
                <span class="dot parks"></span>
                Parks
            </label>

            <label>
                <input type="checkbox" id="toggle-restaurants" checked>
                <span class="dot restaurants"></span>
                Restaurants
            </label>

            <label>
                <input type="checkbox" id="toggle-busstops" checked>
                <span class="dot transport"></span>
                Bus stops
            </label>

            <label>
                <input type="checkbox" id="toggle-saved" checked>
                <span class="dot saved"></span>
                Saved
            </label>
        </div>

        <h2>Basemap</h2>

        <div class="basemap-switch" role="group" aria-label="Basemap style">
            <button type="button" class="basemap-btn active" data-basemap="streets">Streets</button>
            <button type="button" class="basemap-btn" data-basemap="bright">Bright</button>
            <button type="button" class="basemap-btn" data-basemap="light">Light</button>
        </div>

        <div class="legend">
            <p><span class="dot parks"></span> Parks</p>
            <p><span class="dot restaurants"></span> Restaurants</p>
            <p><span class="dot transport"></span> Bus stops</p>
            <p><span class="dot highlight"></span> Search results</p>
        </div>

        <p class="footer">
            A GIS project using OpenStreetMap data.<br>
            Gunjan Gautam | 2026
        </p>
    </aside>

    <div id="scrim" hidden></div>

    <!-- Map area -->
    <main id="map-container">
        <div id="map"></div>

       <button id="menu-btn" class="menu-btn" type="button" aria-label="Open menu" data-icon="menu"></button>

        <button id="locate-btn" class="map-fab" type="button" title="Show my location" aria-label="Show my location" data-icon="locate"></button>

        <button id="reopen-flap" class="reopen" type="button" hidden></button>

        <!-- The "flap": results / place details / directions / saved lists -->
        <section id="flap" class="flap" aria-label="Places panel" hidden>
            <header class="flap-header">
                <button id="flap-back" class="icon-btn" type="button" aria-label="Back" data-icon="back" hidden></button>
                <button id="flap-toggle" class="icon-btn" type="button" aria-label="Collapse panel" aria-expanded="true" data-icon="chevron"></button>
               <button id="flap-close" class="icon-btn" type="button" aria-label="Close panel" data-icon="close"></button>
            </header>
            <div id="flap-body" class="flap-body"></div>
        </section>

        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </main>

    <dialog id="modal" class="modal"></dialog>

    <!-- MapLibre JavaScript -->
    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

    <!-- Our custom JavaScript -->
    <script src="script.js"></script>

</body>
</html>
